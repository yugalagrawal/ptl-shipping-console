<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LT Docket — A4-half design v1</title>
<style>
  :root { --ink:#16181d; --mut:#5f6673; --line:#cfd3da; --soft:#f4f5f7; --acc:#d2541f; --acc-d:#a83f14; --navy:#d2541f; }
  * { box-sizing: border-box; }
  body { margin:0; background:#e6e8ec; font-family: Inter, "Helvetica Neue", Arial, sans-serif; color:var(--ink); }
  .bar { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:14px; align-items:center; padding:10px 18px; background:#fff; border-bottom:1px solid var(--line); font-size:13px; }
  .bar h1 { margin:0 8px 0 0; font-size:15px; }
  .bar label { display:inline-flex; gap:6px; align-items:center; color:var(--mut); }
  .bar select, .bar button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .bar button.pri { background:var(--acc); color:#fff; border-color:var(--acc); font-weight:600; cursor:pointer; }
  .stage { padding:22px 0 60px; display:flex; flex-direction:column; align-items:center; gap:24px; }
  .page { width:210mm; background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.18); }
  .page.half { height:148.5mm; }
  .page.a4 { height:297mm; }
  .slot { height:148.5mm; display:flex; align-items:center; justify-content:center; }
  .slot + .slot { border-top:1px dashed #b8b8b8; }
  .fit { zoom: 0.7480; }               /* 1000px sheet -> 198mm */

  /* ───────── the docket (1000 x 707 px = A4 half) ───────── */
  .dk { width:1000px; height:707px; padding:14px 16px 10px; background:#fff; display:grid; grid-template-rows: auto auto auto 1fr auto auto; gap:8px; font-size:11px; line-height:1.3; color:var(--ink); position:relative; }
  .dk .lab { font-size:8.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--mut); }
  .dk .val { font-size:12px; font-weight:600; min-height:15px; }
  .dk .box { border:1px solid var(--ink); border-radius:6px; }
  .dk .hd { background:var(--navy); color:#fff; font-size:9px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; padding:3px 8px; border-radius:5px 5px 0 0; display:flex; justify-content:space-between; }
  .dk .cb { display:inline-block; width:10px; height:10px; border:1.2px solid var(--ink); border-radius:2px; margin:0 3px 0 6px; vertical-align:-1.5px; text-align:center; font-size:9px; line-height:9px; font-weight:800; }
  .dk .cb:first-child { margin-left:0; }

  /* header */
  .top { display:grid; grid-template-columns: 1fr auto; gap:14px; align-items:stretch; }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand .co { font-size:10px; color:var(--mut); line-height:1.35; }
  .brand .co b { color:var(--ink); font-size:11.5px; }
  .gcn { display:flex; gap:14px; align-items:center; border:1px solid var(--ink); border-radius:8px; padding:6px 12px; }
  .gcn .no { font-size:25px; font-weight:800; letter-spacing:.06em; line-height:1; }
  .gcn .bars { display:flex; height:30px; margin-top:4px; }
  .gcn .bars i { display:block; background:#111; }
  .mode { background:var(--acc-d); color:#fff; font-weight:800; font-size:13px; letter-spacing:.1em; padding:7px 12px; border-radius:6px; text-align:center; }
  .mode small { display:block; font-size:8px; font-weight:600; letter-spacing:.08em; opacity:.85; }

  /* facts strip */
  .facts { display:grid; grid-template-columns: repeat(6,1fr); border:1px solid var(--ink); border-radius:6px; }
  .facts > div { padding:4px 9px; border-left:1px solid var(--line); }
  .facts > div:first-child { border-left:0; }
  .facts .big { font-size:13px; font-weight:800; }

  /* parties */
  .parties { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .party { min-height:62px; }
  .party .body { padding:5px 9px; }
  .party .nm { font-size:13px; font-weight:800; }
  .party .ad { color:#333; font-size:10.5px; }
  .party .g { color:var(--mut); font-size:9.5px; margin-top:1px; }

  /* middle: three columns */
  .mid { display:grid; grid-template-columns: 1.15fr 1.05fr 1fr; gap:8px; min-height:0; }
  .mid .box { display:flex; flex-direction:column; min-height:0; }
  .rows { padding:2px 9px 5px; }
  .rows .r { display:flex; justify-content:space-between; gap:8px; padding:3px 0; border-bottom:1px dotted var(--line); }
  .rows .r:last-child { border-bottom:0; }
  .rows .r .k { color:var(--mut); font-size:9.5px; font-weight:600; white-space:nowrap; }
  .rows .r .v { font-weight:700; text-align:right; }
  .chip { display:inline-block; border:1px solid var(--ink); border-radius:10px; padding:0 7px; font-size:9px; font-weight:700; margin-left:4px; }
  .chip.haz { background:#fde8e0; border-color:var(--acc-d); color:var(--acc-d); }
  .wt { display:grid; grid-template-columns:repeat(4,1fr); border-bottom:1px solid var(--line); }
  .wt > div { padding:5px 7px; border-left:1px solid var(--line); }
  .wt > div:first-child { border-left:0; }
  .wt .n { font-size:17px; font-weight:800; line-height:1.1; }
  .wt .n small { font-size:9px; color:var(--mut); font-weight:600; }
  .wt .hi { background:var(--soft); }
  table.dim { width:100%; border-collapse:collapse; margin:4px 0 0; }
  table.dim th { font-size:8.5px; color:var(--mut); text-align:left; padding:2px 9px; letter-spacing:.06em; text-transform:uppercase; }
  table.dim td { padding:2px 9px; font-weight:600; border-top:1px dotted var(--line); }
  .chg .r.tot { border-top:1.5px solid var(--ink); border-bottom:0; padding-top:5px; margin-top:2px; }
  .chg .r.tot .v { font-size:16px; font-weight:800; }
  .chg .hint { font-size:7px; color:#888; font-weight:400; display:block; line-height:1.1; }

  /* lower */
  .low { display:grid; grid-template-columns: 1.1fr 1fr 1fr; gap:8px; }
  .low .box { min-height:84px; }
  .dochead { display:grid; grid-template-columns:auto 1fr; gap:2px 8px; padding:4px 9px 5px; }
  .pod { padding:4px 9px 5px; display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; }
  .pod .sig { grid-column:1 / -1; border:1px dashed var(--line); border-radius:4px; height:34px; padding:2px 6px; color:var(--mut); font-size:8.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
  .terms { font-size:8px; line-height:1.35; color:#444; padding:4px 9px; }
  .sign { padding:0 9px 5px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .sign div { border-top:1px solid var(--ink); padding-top:2px; font-size:8.5px; color:var(--mut); font-weight:700; letter-spacing:.06em; text-transform:uppercase; height:28px; }

  /* footer */
  .foot { display:flex; align-items:center; gap:14px; border-top:2px solid var(--navy); padding-top:5px; }
  .foot .copy { font-size:13px; font-weight:900; letter-spacing:.12em; color:var(--acc); }
  .foot .gst { font-size:8.5px; color:#333; line-height:1.3; flex:1; }
  .foot .gst b { font-weight:700; }
  .qr { display:flex; align-items:center; gap:7px; font-size:8px; font-weight:700; color:var(--acc); max-width:120px; line-height:1.2; }
  .gen { position:absolute; right:16px; bottom:1px; font-size:6.5px; color:#9a9a9a; }

  @media print {
    @page { size: A4 portrait; margin: 0; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { background:#fff; } .bar { display:none; }
    .stage { padding:0; gap:0; } .page { box-shadow:none; page-break-after:always; }
  }
</style>
</head>
<body>
<div class="bar">
  <h1>LT Docket — A4-half design v1</h1>
  <label>Copy <select id="copy"><option>Shipper Copy</option><option>Consignor Copy</option><option>Consignee Copy</option><option>Driver Copy</option></select></label>
  <label>View <select id="view"><option value="half">One docket (A4 half)</option><option value="a4">A4 sheet — 2 copies</option></select></label>
  <label>Sample <select id="sample"><option value="full">Full docket</option><option value="haz">Hazardous + appointment + ODA</option><option value="min">Minimal (no e-way bill, no pricing)</option></select></label>
  <label><input type="checkbox" id="price" checked> Print pricing</label>
  <button class="pri" onclick="window.print()">Print</button>
</div>
<div class="stage" id="stage"></div>

<script>
// ───────── Sample data — same shape Create Docket produces (keys map 1:1 to the "Fill details" fields) ─────────
const SAMPLES = {

    clientName:'Oriflame', clientCode:'OR-OR-PC-001',

    goods:'Medical consumables', hsn:'3005', contentType:'Pharmaceuticals', handling:['Fragile'], hazardClass:'', unNumber:'',
    invoiceNo:'INV/26-27/1046', invoiceDate:'15-10-2026', invoiceValue:72500, insuredValue:72500, policyNo:'HDFC ERGO / P/123456',

    paymentTerm:'to_pay', riskCover:'carriers_risk', podType:'epod',
    boxes:[{l:30,b:20,h:15,qty:6},{l:40,b:30,h:25,qty:4}], pkgs:10, actualKg:90, volKg:101.4, chargeKg:101.4,
    isOda:false, appointment:false,
    pricing:{ 'Basic freight':2850, 'Docket charges':50, 'Exception charges':0, 'FOV: Owner Risk':0, 'FSC (5%)':143, 'ESS':0, 'Appointment':0, 'Handling':76, 'ODA':0, 'Others':0, gst:553, total:3627 }

    consignee:{ name:'Tata Cliq Luxury — Delhi Experience Centre', address:'DLF Emporio, Vasant Kunj', city:'New Delhi', state:'Delhi', pincode:'110070', gstin:'07AABCT1234L1Z9' },
    goods:'Perfumes & aerosol cartons', hsn:'3303', contentType:'Cosmetics', handling:['Fragile','Hazardous'], hazardClass:'Class 3 — Flammable Liquids', unNumber:'UN1266',
    invoiceNo:'NYK/26/88231', invoiceDate:'16-10-2026', invoiceValue:184000, insuredValue:184000, policyNo:'ICICI Lombard / 40021177',
    ewayBillNo:'123456789002', vehicleNo:'MH12 ZZ 9999', gstPayableBy:'consignor',
    paymentTerm:'tbb', riskCover:'owners_risk', podType:'hardcopy',
    boxes:[{l:50,b:40,h:35,qty:12}], pkgs:12, actualKg:210, volKg:178.2, chargeKg:210,
    isOda:true, odaLocation:'Vasant Kunj', appointment:true, appt:'17-10-2026 · 11:00 AM – 1:00 PM',
    pricing:{ 'Basic freight':9450, 'Docket charges':50, 'Exception charges':0, 'FOV: Owner Risk':50, 'FSC (5%)':473, 'ESS':0, 'Appointment':750, 'Handling':158, 'ODA':520, 'Others':180, gst:2043, total:13674 }
  },
  min: {
    docketNumber:'1000000003', mode:'surface', bookingDate:'16-10-2026', expectedDelivery:'',
    clientName:'Licious', clientCode:'LI-LI-PC-001',
    consignor:{ name:'Licious Cold Hub', address:'', city:'Gurugram', state:'Haryana', pincode:'122001', phone:'' },
    consignee:{ name:'Licious Outlet — HSR Layout', address:'', city:'Bengaluru', state:'Karnataka', pincode:'560102', gstin:'' },
    goods:'', hsn:'', contentType:'Perishables (Non-Frozen)', handling:[], hazardClass:'', unNumber:'',
    invoiceNo:'', invoiceDate:'', invoiceValue:null, insuredValue:null, policyNo:'',
    ewayBillNo:'', ewayExempt:'Not required — value ₹18,500 is within ₹50,000', vehicleNo:'', gstPayableBy:'',
    paymentTerm:'paid', riskCover:'carriers_risk', podType:'epod',
    boxes:[{l:30,b:20,h:15,qty:9}], pkgs:9, actualKg:260, volKg:98, chargeKg:260,
    isOda:false, appointment:false, pricing:null
  }
}

// ───────── Brand marks (same vectors as the console sheet) ─────────
const ltMark = (size) => `<svg width="${size}" height="${size}" viewBox="1520 186 530 608" aria-hidden="true" style="width:${size * 0.87}px;height:${size}px"><polygon points="1784.00,196.54 1868.71,245.45 1614.59,392.18 1529.88,343.27" fill="#FB6B24"/><polygon points="1953.41,294.36 2038.12,343.27 1953.41,392.18 1868.71,343.27" fill="#FB6B24"/><polygon points="1784.00,392.18 1868.71,441.09 1784.00,490.00 1699.29,441.09" fill="#FB6B24"/><polygon points="1529.88,343.27 1614.59,392.18 1614.59,587.82 1784.00,685.64 1784.00,783.46 1529.88,636.73" fill="#D94423"/><polygon points="1699.29,441.09 1784.00,490.00 1784.00,587.82 1699.29,538.91" fill="#D94423"/><polygon points="1784.00,490.00 1868.71,441.09 1868.71,636.73 1953.41,587.82 1953.41,392.18 2038.12,343.27 2038.12,636.73 1784.00,783.46" fill="#AD351A"/></svg>`
const flowWordmark = (h) => `<svg viewBox="4 30 3275 920" style="height:${h}px;width:auto;vertical-align:middle" aria-label="FLOW"><path d="M74.0 146.0 L630.0 146.0 L630.0 311.0 L295.0 311.0 L295.0 429.0 L583.0 429.0 L583.0 587.0 L295.0 587.0 L295.0 834.0 L74.0 834.0Z M751.0 146.0 L972.0 146.0 L972.0 658.0 L1325.0 658.0 L1325.0 834.0 L751.0 834.0Z M2219.0 146.0 L2449.0 146.0 L2530.0 536.0 L2610.0 146.0 L2828.0 146.0 L2913.0 536.0 L2989.0 146.0 L3209.0 146.0 L3048.0 834.0 L2805.0 834.0 L2714.0 416.0 L2623.0 834.0 L2380.0 834.0Z" fill="#1A2B4A"/><rect x="1404" y="110" width="760" height="760" rx="190" ry="190" fill="#1A2B4A"/><polygon points="1784.00,196.54 1868.71,245.45 1614.59,392.18 1529.88,343.27" fill="#FB6B24"/><polygon points="1953.41,294.36 2038.12,343.27 1953.41,392.18 1868.71,343.27" fill="#FB6B24"/><polygon points="1784.00,392.18 1868.71,441.09 1784.00,490.00 1699.29,441.09" fill="#FB6B24"/><polygon points="1529.88,343.27 1614.59,392.18 1614.59,587.82 1784.00,685.64 1784.00,783.46 1529.88,636.73" fill="#D94423"/><polygon points="1699.29,441.09 1784.00,490.00 1784.00,587.82 1699.29,538.91" fill="#D94423"/><polygon points="1784.00,490.00 1868.71,441.09 1868.71,636.73 1953.41,587.82 1953.41,392.18 2038.12,343.27 2038.12,636.73 1784.00,783.46" fill="#AD351A"/></svg>`

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const money = (n) => (n || n === 0 ? Number(n).toLocaleString('en-IN') : '')
const cb = (on) => `<span class="cb">${on ? '✓' : ''}</span>`
const fmtNo = (n) => String(n).replace(/\D/g,'').replace(/(\d{3})(\d{4})(\d{3})/, '$1 $2 $3')
function bars(no, count = 44) {
  const d = String(no).replace(/\D/g,'').split('').map(Number); let o = ''
  for (let i = 0; i < count; i++) { const x = d[i % d.length]; o += `<i style="width:${1 + ((x + i) % 3)}px;margin-right:${1 + ((x * 7 + i) % 2)}px"></i>` }
  return `<div class="bars">${o}</div>`
}
function qr(no, size = 40) {
  const n = 21; let seed = Number(String(no).replace(/\D/g,'').slice(-9)) || 7
  const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff)
  const fin = (x, y) => (x < 7 && y < 7) || (x > n - 8 && y < 7) || (x < 7 && y > n - 8)
  let c = ''
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    let on
    if (fin(x, y)) { const fx = x < 7 ? x : x - (n - 7), fy = y < 7 ? y : y - (n - 7); on = fx===0||fx===6||fy===0||fy===6||(fx>=2&&fx<=4&&fy>=2&&fy<=4) } else on = rnd() > .52
    if (on) c += `<rect x="${x}" y="${y}" width="1" height="1"/>`
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" fill="#111">${c}</svg>`
}

// ───────── The docket (one A4 half) ─────────
function docket(d, copy, showPrice) {
  const MODES = { surface:'SURFACE', air:'AIR', rail:'RAIL', sea:'SEA' }
  const addr = (p) => [p.address, [p.city, p.state].filter(Boolean).join(', '), p.pincode].filter(Boolean).join(' · ')
  const pr = (k) => (showPrice && d.pricing ? money(d.pricing[k]) : '')
  const hazard = (d.handling || []).includes('Hazardous')
  const pay = d.paymentTerm, risk = d.riskCover
  return `<div class="dk">
  <div class="top">
    <div class="brand">
      <div style="display:flex;align-items:center;gap:6px"><span style="font-size:26px;font-weight:700;letter-spacing:-.03em">lets</span>${ltMark(32)}<span style="font-size:26px;font-weight:700;letter-spacing:-.03em">transport</span></div>
      <div class="co"><b>Diptab Ventures Private Limited</b><br>EXPRESS DISTRIBUTION · COLLAB24 EPIP, Regent Gateway Road No. 2, Seetharampalya, Whitefield, Bengaluru 560048<br>ptl@letstransport.team</div>
    </div>
    <div style="display:flex;gap:8px;align-items:stretch">
      <div class="mode">${MODES[d.mode] || ''}<small>MODE</small></div>
      <div class="gcn"><div><div class="lab">Goods Consignment Note · CN No.</div><div class="no">${esc(fmtNo(d.docketNumber))}</div></div><div style="width:150px">${bars(d.docketNumber, 40)}</div></div>
    </div>
  </div>

  <div class="facts">
    <div><div class="lab">Booking date</div><div class="val">${esc(d.bookingDate)}</div></div>
    <div><div class="lab">Expected delivery</div><div class="val">${esc(d.expectedDelivery)}</div></div>
    <div><div class="lab">Origin</div><div class="val big">${esc((d.consignor.city||'').toUpperCase())}</div></div>
    <div><div class="lab">Destination</div><div class="val big">${esc((d.consignee.city||'').toUpperCase())}</div></div>
    <div><div class="lab">ODA delivery</div><div class="val">${cb(d.isOda===true)}Yes ${cb(d.isOda===false)}No</div></div>
    <div><div class="lab">${d.appointment ? 'Appointment' : 'ODA location'}</div><div class="val" style="font-size:10.5px">${esc(d.appointment ? d.appt : (d.isOda ? d.odaLocation : ''))}</div></div>
  </div>

  <div class="parties">
    <div class="box party"><div class="hd"><span>Consignor</span><span>Client code · ${esc(d.clientCode)}</span></div><div class="body"><div class="nm">${esc(d.consignor.name)}</div><div class="ad">${esc(addr(d.consignor))}</div>${d.consignor.phone ? `<div class="g">Ph ${esc(d.consignor.phone)}</div>` : ''}</div></div>
    <div class="box party"><div class="hd"><span>Consignee</span><span>${d.consignee.gstin ? 'GSTIN · ' + esc(d.consignee.gstin) : ''}</span></div><div class="body"><div class="nm">${esc(d.consignee.name)}</div><div class="ad">${esc(addr(d.consignee))}</div></div></div>
  </div>

  <div class="mid">
    <div class="box">
      <div class="hd"><span>Goods &amp; documents</span></div>
      <div class="rows">
        <div class="r"><span class="k">Said to contain</span><span class="v">${esc(d.goods || d.contentType)}${d.hsn ? ` <span class="chip">HSN ${esc(d.hsn)}</span>` : ''}</span></div>
        <div class="r"><span class="k">Content</span><span class="v">${esc(d.contentType)}${(d.handling||[]).map((h) => `<span class="chip ${h==='Hazardous'?'haz':''}">${esc(h)}</span>`).join('')}</span></div>
        ${hazard ? `<div class="r"><span class="k">Hazard class · UN no.</span><span class="v" style="color:var(--acc-d)">${esc(d.hazardClass)} · ${esc(d.unNumber)}</span></div>` : ''}
        <div class="r"><span class="k">Invoice no. · date</span><span class="v">${esc(d.invoiceNo)}${d.invoiceDate ? ' · ' + esc(d.invoiceDate) : ''}</span></div>
        <div class="r"><span class="k">Invoice value</span><span class="v">${d.invoiceValue ? '₹' + money(d.invoiceValue) : ''}</span></div>
        <div class="r"><span class="k">E-way bill no.</span><span class="v">${esc(d.ewayBillNo) || `<span style="font-weight:500;color:var(--mut);font-size:10px">${esc(d.ewayExempt || '')}</span>`}</span></div>
        <div class="r"><span class="k">Vehicle</span><span class="v">${esc(d.vehicleNo)}</span></div>
        <div class="r"><span class="k">GST payable by</span><span class="v">${cb(d.gstPayableBy==='consignor')}Consignor ${cb(d.gstPayableBy==='consignee')}Consignee ${cb(d.gstPayableBy==='lt')}LT</span></div>
      </div>
    </div>

    <div class="box">
      <div class="hd"><span>Packages &amp; weight</span><span>Volume in cm</span></div>
      <div class="wt">
        <div><div class="lab">Packages</div><div class="n">${esc(d.pkgs)}</div></div>
        <div><div class="lab">Actual</div><div class="n">${esc(d.actualKg)}<small> kg</small></div></div>
        <div><div class="lab">Volumetric</div><div class="n">${esc(d.volKg)}<small> kg</small></div></div>
        <div class="hi"><div class="lab">Charge wt</div><div class="n">${esc(d.chargeKg)}<small> kg</small></div></div>
      </div>
      <table class="dim"><tr><th>L</th><th>B</th><th>H</th><th>Pcs</th></tr>${(d.boxes||[]).map((b) => `<tr><td>${b.l}</td><td>${b.b}</td><td>${b.h}</td><td>${b.qty}</td></tr>`).join('')}</table>
      <div class="rows" style="margin-top:auto">
        <div class="r"><span class="k">Payment</span><span class="v">${cb(pay==='paid')}Paid ${cb(pay==='to_pay')}To-Pay ${cb(pay==='tbb')}TBB</span></div>
        <div class="r"><span class="k">Risk</span><span class="v">${cb(risk==='owners_risk')}Owner ${cb(risk==='carriers_risk')}Carrier</span></div>
        <div class="r"><span class="k">Insurance</span><span class="v">${esc(d.policyNo)}${d.insuredValue ? ' · ₹' + money(d.insuredValue) : ''}</span></div>
      </div>
    </div>

    <div class="box chg">
      <div class="hd"><span>Charges</span><span>₹</span></div>
      <div class="rows">
        ${[['Basic freight','Basic freight'],['Docket charges','Docket charges'],['Exception charges','Exception charges'],['FOV: Owner Risk','FOV: Owner Risk'],['FSC','FSC (5%)'],['ESS','ESS'],['Appointment','Appointment'],['Handling','Handling'],['ODA','ODA']].map(([l,k]) => `<div class="r"><span class="k">${l}</span><span class="v">${pr(k)}</span></div>`).join('')}
        <div class="r"><span class="k">Others<span class="hint">e.g. COD fee, Mathadi, other agreed</span></span><span class="v">${pr('Others')}</span></div>
        <div class="r"><span class="k">GST</span><span class="v">${showPrice && d.pricing ? money(d.pricing.gst) : ''}</span></div>
        <div class="r tot"><span class="k" style="color:var(--ink);font-size:10.5px">TOTAL</span><span class="v">${showPrice && d.pricing ? '₹' + money(d.pricing.total) : ''}</span></div>
      </div>
    </div>
  </div>

  <div class="low">
    <div class="box">
      <div class="hd"><span>Documents received</span></div>
      <div class="dochead">
        <span class="lab">1 Invoice #</span><span class="val">${esc(d.invoiceNo)}</span>
        <span class="lab">2 GST no.</span><span class="val">${esc(d.consignee.gstin)}</span>
        <span class="lab">3 Form / Permit #</span><span class="val"></span>
        <span class="lab">4 Declaration</span><span class="val">${d.ewayBillNo || d.ewayExempt ? '✓' : ''}</span>
        <span class="lab" style="align-self:end">Message</span><span class="val" style="border-bottom:1px dotted var(--line);height:15px"></span>
      </div>
    </div>
    <div class="box">
      <div class="hd"><span>Proof of delivery</span><span>${{epod:'ePOD',hardcopy:'Hardcopy',consignor_dc:'Consignor DC'}[d.podType] || ''}</span></div>
      <div class="pod"><div class="lab">Name</div><div class="lab">Date · Time</div><div class="lab">Cell no.</div><div class="lab"></div><div class="sig">Receiver seal &amp; signature</div></div>
    </div>
    <div class="box">
      <div class="hd"><span>Consignor's declaration</span></div>
      <div class="terms">I agree to the terms and conditions on the reverse of this consignor's copy of this non-negotiable consignment note and warrant that the information given is true and correct. Duties/taxes on the shipment are payable by the consignee on delivery. LT holds a lien on the shipment until all dues are paid; insurance is recommended for valuables.</div>
      <div class="sign"><div>Sender seal &amp; signature</div><div>Booking staff · date</div></div>
    </div>
  </div>

  <div class="foot">
    <span class="copy">${esc(copy.toUpperCase())}</span>
    <div class="gst"><b>GST</b> · Delhi 07AAFCD3098K1ZB · Mumbai 27AAFCD3098K1Z9 · Kolkata 19AAFCD3098K1Z6 · Bangalore 29AAFCD3098K1Z5</div>

    <div class="qr">${qr(d.docketNumber)}<span>SCAN QR CODE TO TRACK SHIPMENT</span></div>
  </div>
  <div class="gen">Auto-generated by ${flowWordmark(8)}</div>
</div>`
}

// ───────── Stage ─────────
function render() {
  const copy = document.getElementById('copy').value
  const view = document.getElementById('view').value
  const s = SAMPLES[document.getElementById('sample').value]
  const price = document.getElementById('price').checked
  const copies = ['Shipper Copy','Consignor Copy','Consignee Copy','Driver Copy']
  const second = copies[(copies.indexOf(copy) + 1) % copies.length]
  const one = (c) => `<div class="fit">${docket(s, c, price)}</div>`
  document.getElementById('stage').innerHTML = view === 'half'
    ? `<div class="page half"><div class="slot">${one(copy)}</div></div>`
    : `<div class="page a4"><div class="slot">${one(copy)}</div><div class="slot">${one(second)}</div></div>`
}
document.querySelectorAll('.bar select, .bar input').forEach((el) => el.addEventListener('change', render))
render()
</script>
</body>
</html>
